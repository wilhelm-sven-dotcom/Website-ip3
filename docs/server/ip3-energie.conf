# nginx: Server-Blöcke für www.ip3-energie.de (Alternative zu Apache mit .htaccess).
# Ablage: /etc/nginx/sites-available/ip3-energie.conf, Regeln: /etc/nginx/snippets/ip3-regeln.conf
# Zertifikatspfade an die eigene Einrichtung anpassen (hier: certbot / Let's Encrypt).
# Ab nginx 1.25.1 statt "listen 443 ssl http2" besser "listen 443 ssl;" und "http2 on;".
# Ohne IPv6 auf dem Server die Zeilen "listen [::]:…" entfernen, sonst startet nginx nicht.

# http -> https, ohne www -> www
server {
    listen 80;
    listen [::]:80;
    server_name ip3-energie.de www.ip3-energie.de;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ip3-energie;
    }
    location / {
        return 301 https://www.ip3-energie.de$request_uri;
    }
}

# https ohne www -> www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ip3-energie.de;
    ssl_certificate     /etc/letsencrypt/live/www.ip3-energie.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ip3-energie.de/privkey.pem;
    return 301 https://www.ip3-energie.de$request_uri;
}

# Website
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ip3-energie.de;
    ssl_certificate     /etc/letsencrypt/live/www.ip3-energie.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ip3-energie.de/privkey.pem;
    root /var/www/ip3-energie;   # hierhin den Inhalt von 01-website hochladen
    include /etc/nginx/snippets/ip3-regeln.conf;
}
