# nginx: Regeln der Website ip3-energie.de (statischer Export von Astro, build.format "file").
# Entspricht public/.htaccess für Apache. Saubere URLs ohne .html und ohne Schrägstrich am Ende:
# /ueber-uns, /unsere-leistungen/privat. PHP nur für das Kontaktformular kontakt-senden.php.
# Einbinden im server-Block nach der root-Anweisung (siehe ip3-energie.conf und test-ip3-energie.conf):
#   root /var/www/ip3-energie;
#   include /etc/nginx/snippets/ip3-regeln.conf;

index index.html;
charset utf-8;
error_page 404 /404.html;
server_tokens off;

gzip on;
gzip_types text/css application/javascript text/javascript image/svg+xml application/xml text/plain;

# Schrägstrich am Ende entfernen (außer Startseite)
rewrite ^/(.+)/$ /$1 permanent;

# /index und /index.html auf die Startseite, .html in der Adresse auf die saubere URL
if ($request_uri ~ ^/index(\.html)?(\?.*)?$) {
    return 301 /$2;
}
if ($request_uri ~ ^/(?!404\.html)(.+)\.html(\?.*)?$) {
    return 301 /$1$2;
}

# Sicherheits-Header; nginx vererbt add_header nicht in Blöcke mit eigenem add_header,
# deshalb stehen sie unten in jedem location-Block erneut
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Zertifikatsabruf (Let's Encrypt) erlauben, sonstige versteckte Dateien (.htaccess) sperren
location ^~ /.well-known/ {
    try_files $uri =404;
}
location ~ /\. {
    deny all;
}

# Startseite und Seiten: saubere URL auf die .html-Datei, HTML nicht cachen
location = / {
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
location / {
    try_files $uri $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# Gehashte Build-Dateien und Schriften dauerhaft cachen, Bilder 30 Tage
location ~* \.(?:js|css|woff2)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ~* \.(?:webp|jpg|jpeg|png|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Kontaktformular: einziges PHP-Skript der Website
location = /kontakt-senden.php {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # Pfad an die installierte PHP-Version anpassen
}
location ~ \.php$ {
    return 404;
}
