# nginx: Testumgebung test.ip3-energie.de mit Passwortschutz. nginx liest die .htaccess des
# Testpakets nicht, deshalb hier der Schutz per auth_basic. Ohne Passwort antwortet jede Adresse
# mit 401, die robots.txt des Testpakets sperrt zusätzlich alle Suchmaschinen.
# Ablage: /etc/nginx/sites-available/test-ip3-energie.conf, Regeln: /etc/nginx/snippets/ip3-regeln.conf
# Passwortdatei anlegen (Benutzer ip3, das Passwort wird abgefragt):
#   htpasswd -c /etc/nginx/ip3-test.htpasswd ip3                       (Paket apache2-utils)
#   printf 'ip3:%s\n' "$(openssl passwd -apr1)" > /etc/nginx/ip3-test.htpasswd   (ohne apache2-utils)
# Zertifikat, http2 und IPv6 wie in ip3-energie.conf. Nach dem Livegang diesen Block wieder entfernen.

# http -> https
server {
    listen 80;
    listen [::]:80;
    server_name test.ip3-energie.de;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ip3-test;
    }
    location / {
        return 301 https://test.ip3-energie.de$request_uri;
    }
}

# Testumgebung
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.ip3-energie.de;
    ssl_certificate     /etc/letsencrypt/live/test.ip3-energie.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ip3-energie.de/privkey.pem;
    root /var/www/ip3-test;   # hierhin den Inhalt des Testpakets hochladen
    auth_basic "ip3 Testumgebung";
    auth_basic_user_file /etc/nginx/ip3-test.htpasswd;
    include /etc/nginx/snippets/ip3-regeln.conf;
}
